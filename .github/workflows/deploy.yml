name: Deploy to Railway

on:
 push:
 branches: [ "main" ]
 paths:
 - "main.py"
 - "requirements.txt"
 - "Procfile"
 - "runtime.txt"
 - "guides.json"
 - "bot_settings.json"
 workflow_dispatch:

permissions:
 contents: read

jobs:
 # ─────────────────────────────────────────────
 # Pre-deploy checks
 # ─────────────────────────────────────────────
 pre-deploy-check:
 name: Pre-Deploy Checks
 runs-on: ubuntu-latest

 steps:
 - name: ⬇ Checkout repository
 uses: actions/checkout@v4

 - name: Set up Python 3.11
 uses: actions/setup-python@v5
 with:
 python-version: "3.11"
 cache: "pip"

 - name: Install dependencies
 run: |
 python -m pip install --upgrade pip
 pip install -r requirements.txt

 - name: Syntax check main.py
 run: python -m py_compile main.py && echo " Syntax OK"

 - name: Validate guides.json
 run: |
 python -c "
 import json
 with open('guides.json', 'r', encoding='utf-8') as f:
 data = json.load(f)
 total = sum(len(v) for v in data.values() if isinstance(v, dict))
 print(f' guides.json: {len(data)} categories, {total} entries')
 "

 - name: Check Procfile
 run: |
 cat Procfile
 grep -q "worker:" Procfile && echo " Procfile OK" || (echo " Procfile missing worker entry" && exit 1)

 # ─────────────────────────────────────────────
 # Deploy to Railway
 # ─────────────────────────────────────────────
 deploy:
 name: Deploy to Railway
 runs-on: ubuntu-latest
 needs: pre-deploy-check
 # Only deploy if RAILWAY_TOKEN secret is configured
 if: ${{ vars.RAILWAY_DEPLOY_ENABLED == 'true' }}

 steps:
 - name: ⬇ Checkout repository
 uses: actions/checkout@v4

 - name: Deploy via Railway CLI
 uses: bervProject/railway-deploy@main
 with:
 railway_token: ${{ secrets.RAILWAY_TOKEN }}
 service: ${{ vars.RAILWAY_SERVICE || 'ryazhenka-bot' }}

 - name: Deploy complete
 run: echo " Successfully deployed to Railway!"

 # ─────────────────────────────────────────────
 # Notify on failure
 # ─────────────────────────────────────────────
 notify-failure:
 name: Notify on Failure
 runs-on: ubuntu-latest
 needs: [pre-deploy-check, deploy]
 if: failure()

 steps:
 - name: Deployment failed
 run: |
 echo " Deployment pipeline failed!"
 echo "Branch: ${{ github.ref_name }}"
 echo "Commit: ${{ github.sha }}"
 echo "Author: ${{ github.actor }}"
 echo "Please check the workflow logs for details."
