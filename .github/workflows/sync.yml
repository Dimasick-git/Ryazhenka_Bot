name:  Auto Sync & Update

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Force full sync"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Validate guides.json integrity
  # ─────────────────────────────────────────────
  validate:
    name:  Validate Data Integrity
    runs-on: ubuntu-latest

    steps:
      - name: ⬇ Checkout repository
        uses: actions/checkout@v7

      - name:  Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name:  Validate guides.json
        run: |
          python -c "
          import json, sys

          with open('guides.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          errors = []
          for cat, items in data.items():
              if not isinstance(items, dict):
                  errors.append(f'Category {cat!r} is not a dict')
                  continue
              for title, url in items.items():
                  if not isinstance(title, str) or not title.strip():
                      errors.append(f'Empty title in {cat!r}')
                  if url and not isinstance(url, str):
                      errors.append(f'Non-string URL for {title!r} in {cat!r}')

          if errors:
              print(' Validation errors:')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)

          total = sum(len(v) for v in data.values())
          print(f' guides.json valid: {len(data)} categories, {total} entries')
          "

  # ─────────────────────────────────────────────
  # Auto-generate synonyms
  # ─────────────────────────────────────────────
  generate-synonyms:
    name:  Regenerate Synonyms
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: ⬇ Checkout repository
        uses: actions/checkout@v7

      - name:  Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name:  Regenerate synonyms
        run: |
          python scripts/generate_synonyms.py
          echo " Synonyms regenerated"

      - name:  Commit updated synonyms
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: " auto: regenerate synonyms [skip ci]"
          file_pattern: "generated_synonyms.json"
          commit_user_name: "Dimasick-git"
          commit_user_email: "dimaorynchukk@gmail.com"
